[project]
name = "pipeline-tools"
version = "1.1.1"
description = "Multimodal Ingestion, Prompt Workbench & Export Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pixeltable",
    "gradio",
    "pyyaml",
    "pydantic",
    "pandas",
    "google-genai",
]

[project.optional-dependencies]
test = [
    "playwright>=1.40.0",
    "pytest>=8.0.0",
]


