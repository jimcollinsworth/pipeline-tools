[project]
name = "pipeline-tools"
version = "1.3.9"
description = "A multimodal document and asset pipeline workbench powered by Pixeltable and Gradio."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pixeltable",
    "gradio",
    "pyyaml",
    "pydantic",
    "pandas",
    "google-genai",
    "librosa",
    "soundfile",
    "matplotlib",
]

[project.optional-dependencies]
test = [
    "playwright>=1.40.0",
    "pytest>=8.0.0",
]


